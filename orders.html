<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BookNest - My Orders</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{

    min-height:100vh;

    padding:30px 15px;

    background:
    linear-gradient(
        -45deg,
        #6a11cb,
        #2575fc,
        #ff4ecd,
        #00c6ff,
        #7b2ff7
    );

    background-size:500% 500%;

    animation:bgMove 15s ease infinite;

    overflow-x:hidden;
}


@keyframes bgMove{

    0%{
        background-position:0% 50%;
    }

    25%{
        background-position:100% 50%;
    }

    50%{
        background-position:100% 100%;
    }

    75%{
        background-position:0% 100%;
    }

    100%{
        background-position:0% 50%;
    }

}


/* GLOW */

body::before,
body::after{

    content:"";

    position:fixed;

    width:260px;
    height:260px;

    border-radius:50%;

    filter:blur(80px);

    opacity:.5;

    z-index:-1;

    animation:float 8s ease-in-out infinite alternate;
}


body::before{

    background:#ff69d4;

    top:5%;
    left:-80px;
}


body::after{

    background:#00eaff;

    bottom:5%;
    right:-80px;
}


@keyframes float{

    from{
        transform:translateY(0) scale(1);
    }

    to{
        transform:translateY(70px) scale(1.2);
    }

}


/* MAIN */

.container{

    max-width:1050px;

    margin:auto;
}


/* HEADER */

.header{

    background:rgba(255,255,255,.95);

    backdrop-filter:blur(15px);

    padding:20px 28px;

    border-radius:22px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.18);

    animation:slideDown .7s ease;
}


@keyframes slideDown{

    from{

        opacity:0;

        transform:translateY(-25px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


.logo{

    font-size:30px;

    font-weight:900;

    background:
    linear-gradient(
        90deg,
        #7b2ff7,
        #ff1493,
        #2575fc
    );

    -webkit-background-clip:text;

    color:transparent;
}


.tagline{

    font-size:12px;

    color:#777;

    margin-top:3px;
}


.shop-btn{

    text-decoration:none;

    color:white;

    padding:11px 18px;

    border-radius:12px;

    font-weight:bold;

    background:
    linear-gradient(
        90deg,
        #7b2ff7,
        #ff1493
    );

    transition:.3s;

    white-space:nowrap;
}


.shop-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 8px 20px
    rgba(123,47,247,.35);
}


/* TITLE */

.page-title{

    text-align:center;

    color:white;

    margin-bottom:25px;

    animation:fadeIn .8s ease;
}


.page-title h1{

    font-size:34px;

    margin-bottom:7px;
}


.page-title p{

    font-size:14px;

    opacity:.9;
}


@keyframes fadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}


/* ORDER CARD */

.order-card{

    background:rgba(255,255,255,.97);

    backdrop-filter:blur(15px);

    border-radius:23px;

    padding:25px;

    margin-bottom:22px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.17);

    animation:cardIn .6s ease both;

    transition:.3s;
}


.order-card:hover{

    transform:translateY(-4px);

    box-shadow:
    0 20px 45px rgba(0,0,0,.23);
}


@keyframes cardIn{

    from{

        opacity:0;

        transform:translateY(25px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


/* ORDER HEADER */

.order-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding-bottom:18px;

    border-bottom:1px solid #eee;

    gap:15px;
}


.order-id{

    font-size:15px;

    font-weight:800;

    color:#5b21b6;

    margin-bottom:5px;
}


.order-date{

    font-size:12px;

    color:#777;
}


.status{

    background:#dcfce7;

    color:#15803d;

    padding:8px 14px;

    border-radius:20px;

    font-size:13px;

    font-weight:bold;

    white-space:nowrap;
}


/* PRODUCT */

.product{

    display:flex;

    gap:20px;

    padding:22px 0;

    border-bottom:1px solid #eee;
}


.product img{

    width:115px;

    height:150px;

    object-fit:cover;

    border-radius:14px;

    border:2px solid #eee;

    box-shadow:
    0 8px 20px rgba(0,0,0,.12);

    transition:.3s;

    background:white;
}


.product img:hover{

    transform:
    scale(1.05)
    rotate(-2deg);
}


.product-info{

    flex:1;
}


.product-info h2{

    color:#333;

    font-size:21px;

    margin-bottom:10px;
}


.product-info p{

    color:#666;

    margin:7px 0;

    font-size:14px;
}


.product-info b{

    color:#333;
}


/* DETAILS */

.details{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

    padding:20px 0;

    border-bottom:1px solid #eee;
}


.detail-box{

    background:
    linear-gradient(
        135deg,
        #f5f3ff,
        #eff6ff
    );

    padding:15px;

    border-radius:13px;
}


.detail-box span{

    display:block;

    color:#777;

    font-size:12px;

    margin-bottom:5px;
}


.detail-box b{

    color:#333;

    font-size:14px;
}


/* ADDRESS */

.address{

    margin-top:18px;

    padding:16px;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #faf5ff,
        #eff6ff
    );

    color:#555;

    font-size:14px;

    line-height:1.7;
}


.address-title{

    color:#5b21b6;

    font-weight:800;

    margin-bottom:5px;
}


/* PRICE */

.price-section{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding-top:20px;

    gap:15px;
}


.price-details{

    font-size:13px;

    color:#777;

    line-height:1.8;
}


.discount{

    color:#16a34a;

    font-weight:bold;
}


.total{

    font-size:24px;

    font-weight:900;

    color:#6d28d9;

    white-space:nowrap;
}


/* RETURN STATUS */

.return-status{

    margin-top:18px;

    padding:13px 15px;

    border-radius:12px;

    background:#fff7ed;

    color:#c2410c;

    border:1px solid #fed7aa;

    font-size:13px;

    font-weight:bold;
}


/* RETURN BUTTON */

.return-btn{

    width:100%;

    margin-top:18px;

    padding:14px;

    border:none;

    border-radius:13px;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        90deg,
        #ff4ecd,
        #7b2ff7
    );

    transition:.3s;
}


.return-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 10px 25px
    rgba(123,47,247,.3);
}


.return-btn.disabled{

    background:#d1d5db;

    color:#6b7280;

    cursor:not-allowed;

}


.return-btn.disabled:hover{

    transform:none;

    box-shadow:none;
}


/* EMPTY */

.empty{

    background:rgba(255,255,255,.96);

    padding:55px 25px;

    border-radius:25px;

    text-align:center;

    box-shadow:
    0 15px 40px rgba(0,0,0,.17);

    animation:cardIn .7s ease;
}


.empty-icon{

    font-size:65px;

    margin-bottom:15px;
}


.empty h2{

    color:#5b21b6;

    margin-bottom:8px;
}


.empty p{

    color:#777;

    margin-bottom:23px;
}


.empty-btn{

    display:inline-block;

    text-decoration:none;

    color:white;

    padding:13px 25px;

    border-radius:13px;

    font-weight:bold;

    background:
    linear-gradient(
        90deg,
        #7b2ff7,
        #ff1493,
        #2575fc
    );

    transition:.3s;
}


.empty-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 10px 25px
    rgba(123,47,247,.35);
}


/* MOBILE */

@media(max-width:650px){

    body{
        padding:15px;
    }

    .header{

        flex-direction:column;

        gap:13px;

        text-align:center;
    }

    .page-title h1{

        font-size:28px;
    }

    .order-header{

        flex-direction:column;

        align-items:flex-start;
    }

    .product{

        align-items:flex-start;
    }

    .product img{

        width:90px;

        height:125px;
    }

    .details{

        grid-template-columns:1fr;
    }

    .price-section{

        flex-direction:column;

        align-items:flex-start;
    }

    .total{

        font-size:22px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div>

            <div class="logo">
                📚 BookNest
            </div>

            <div class="tagline">
                Read • Explore • Enjoy
            </div>

        </div>


        <a
            href="book.html"
            class="shop-btn">

            🛍️ Continue Shopping

        </a>

    </div>



    <!-- TITLE -->

    <div class="page-title">

        <h1>
            📦 My Orders
        </h1>

        <p>
            View your ordered books and manage returns
        </p>

    </div>



    <!-- ORDERS CONTAINER -->

    <div id="ordersContainer"></div>


</div>



<script>


/* =====================================================
   GET ORDERS
===================================================== */

let orders = [];


try{

    orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];

}
catch(error){

    orders = [];

}



/* =====================================================
   CONTAINER
===================================================== */

const container =
    document.getElementById(
        "ordersContainer"
    );



/* =====================================================
   NO ORDERS
===================================================== */

if(orders.length === 0){

    container.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                📚
            </div>

            <h2>
                No Orders Yet
            </h2>

            <p>
                You haven't placed any orders yet.
                Start exploring BookNest!
            </p>

            <a
                href="book.html"
                class="empty-btn">

                🛍️ Start Shopping

            </a>

        </div>

    `;

}



/* =====================================================
   SHOW ORDERS
===================================================== */

orders
.slice()
.reverse()
.forEach(
    function(order,index){

        const product =
            order.product || {};


        const address =
            order.address || {};


        /* -----------------------------------------
           ADDRESS TEXT
        ----------------------------------------- */

        let addressText = "";


        if(address.door){

            addressText +=
            address.door + ", ";

        }


        if(address.street){

            addressText +=
            address.street + ", ";

        }


        if(address.city){

            addressText +=
            address.city + ", ";

        }


        if(address.district){

            addressText +=
            address.district + ", ";

        }


        if(address.state){

            addressText +=
            address.state + " - ";

        }


        if(address.pincode){

            addressText +=
            address.pincode;

        }


        if(address.landmark){

            addressText +=
            "<br>Landmark: " +
            address.landmark;

        }


        /* -----------------------------------------
           RETURN STATUS
        ----------------------------------------- */

        let returnStatusHTML = "";


        let returnButtonHTML = "";


        if(order.returnStatus){

            returnStatusHTML = `

                <div class="return-status">

                    🔄 ${order.returnStatus}

                    ${
                        order.returnRequestId
                        ?
                        `
                        <br>

                        Request ID:
                        ${order.returnRequestId}
                        `
                        :
                        ""
                    }

                </div>

            `;


            returnButtonHTML = `

                <button
                    class="return-btn disabled"
                    disabled>

                    ✓ Return / Exchange Request Submitted

                </button>

            `;

        }
        else{

            returnButtonHTML = `

                <button
                    class="return-btn"
                    onclick="openReturnExchange('${order.orderId}')">

                    🔄 Return / Exchange

                </button>

            `;

        }



        /* -----------------------------------------
           DISCOUNT
        ----------------------------------------- */

        let discountHTML = "";


        if(
            Number(order.discount || 0) > 0
        ){

            discountHTML = `

                <div class="discount">

                    🎉 Discount:
                    ₹${Number(order.discount)}

                </div>

            `;

        }



        /* -----------------------------------------
           CREATE CARD
        ----------------------------------------- */

        const card =
            document.createElement("div");


        card.className =
            "order-card";


        card.style.animationDelay =
            (index * 0.1) + "s";


        card.innerHTML = `

            <!-- ORDER HEADER -->

            <div class="order-header">

                <div>

                    <div class="order-id">

                        🆔 Order ID:
                        ${order.orderId || "N/A"}

                    </div>

                    <div class="order-date">

                        📅
                        ${order.orderDate || ""}

                    </div>

                </div>


                <div class="status">

                    ✓
                    ${order.status || "Order Confirmed"}

                </div>

            </div>



            <!-- PRODUCT -->

            <div class="product">


                <img

                    src="${
                        product.image ||
                        "https://via.placeholder.com/150x220?text=Book"
                    }"

                    alt="${product.name || "Book"}"


                    onerror="
                        this.src='https://via.placeholder.com/150x220?text=Book'
                    ">


                <div class="product-info">


                    <h2>

                        ${
                            product.name ||
                            "Book"
                        }

                    </h2>


                    <p>

                        📦 Quantity:

                        <b>
                            ${product.quantity || 1}
                        </b>

                    </p>


                    <p>

                        💰 Book Price:

                        <b>
                            ₹${Number(product.price || 0)}
                        </b>

                    </p>


                </div>

            </div>



            <!-- DETAILS -->

            <div class="details">


                <div class="detail-box">

                    <span>
                        💳 Payment Method
                    </span>

                    <b>

                        ${
                            order.paymentMethod ||
                            "Not Available"
                        }

                    </b>

                </div>


                <div class="detail-box">

                    <span>
                        🔄 Return / Exchange
                    </span>

                    <b>
                        Within 7 Days
                    </b>

                </div>


            </div>



            <!-- ADDRESS -->

            <div class="address">

                <div class="address-title">

                    📍 Delivery Address

                </div>


                <b>

                    ${
                        address.name ||
                        "Customer"
                    }

                </b>


                <br>


                ${addressText}


                ${
                    address.mobile
                    ?
                    `
                    <br>
                    📞 ${address.mobile}
                    `
                    :
                    ""
                }

            </div>



            <!-- PRICE -->

            <div class="price-section">


                <div class="price-details">

                    <div>

                        Subtotal:
                        ₹${Number(order.subtotal || 0)}

                    </div>


                    ${discountHTML}


                    <div>

                        🚚 Delivery:
                        FREE

                    </div>

                </div>


                <div class="total">

                    Total:
                    ₹${Number(order.total || 0)}

                </div>


            </div>



            <!-- RETURN STATUS -->

            ${returnStatusHTML}


            <!-- RETURN BUTTON -->

            ${returnButtonHTML}

        `;


        container.appendChild(card);

    }
);



/* =====================================================
   OPEN RETURN / EXCHANGE
===================================================== */

function openReturnExchange(orderId){


    /* GET ALL ORDERS */

    let allOrders = [];


    try{

        allOrders =
            JSON.parse(
                localStorage.getItem(
                    "orders"
                )
            ) || [];

    }
    catch(error){

        allOrders = [];

    }



    /* FIND EXACT ORDER */

    const selectedOrder =
        allOrders.find(
            function(order){

                return (
                    order.orderId ===
                    orderId
                );

            }
        );



    /* ORDER NOT FOUND */

    if(!selectedOrder){

        alert(
            "Order details not found."
        );

        return;

    }



    /* SAVE SELECTED ORDER */

    localStorage.setItem(

        "returnOrder",

        JSON.stringify(
            selectedOrder
        )

    );



    /* OPEN RETURN PAGE */

    window.location.href =
        "return-exchange.html";

}

</script>


</body>

</html>
