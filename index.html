<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookNest - A Home for Every Story</title>

    <style>

        /* =========================
           BASIC RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
        }


        /* =========================
           MAIN BACKGROUND
        ========================= */

        .page {
            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #4a176e 0%,
                    #250b55 35%,
                    #10024a 70%,
                    #020b50 100%
                );
        }


        /* =========================
           COLORFUL GLOW
        ========================= */

        .pink-glow {
            position: absolute;

            width: 600px;
            height: 600px;

            border-radius: 50%;

            background: #e50087;

            filter: blur(150px);

            opacity: 0.35;

            top: -180px;
            right: -100px;

            animation: glow1 7s ease-in-out infinite;
        }


        .blue-glow {
            position: absolute;

            width: 600px;
            height: 600px;

            border-radius: 50%;

            background: #0077ff;

            filter: blur(160px);

            opacity: 0.35;

            bottom: -250px;
            left: -150px;

            animation: glow2 8s ease-in-out infinite;
        }


        .orange-glow {
            position: absolute;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            background: #ff7200;

            filter: blur(150px);

            opacity: 0.3;

            top: -100px;
            right: -100px;

            animation: glow3 6s ease-in-out infinite;
        }


        @keyframes glow1 {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-100px, 100px);
            }
        }


        @keyframes glow2 {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(100px, -70px);
            }
        }


        @keyframes glow3 {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }


        /* =========================
           STARS
        ========================= */

        .stars span {
            position: absolute;

            width: 5px;
            height: 5px;

            background: white;

            border-radius: 50%;

            box-shadow: 0 0 12px white;

            animation: twinkle 2s infinite alternate;
        }


        .stars span:nth-child(1) {
            top: 10%;
            left: 14%;
        }

        .stars span:nth-child(2) {
            top: 18%;
            left: 30%;
            animation-delay: .5s;
        }

        .stars span:nth-child(3) {
            top: 12%;
            right: 25%;
            animation-delay: 1s;
        }

        .stars span:nth-child(4) {
            top: 28%;
            right: 8%;
            animation-delay: .8s;
        }

        .stars span:nth-child(5) {
            bottom: 20%;
            left: 8%;
            animation-delay: .3s;
        }

        .stars span:nth-child(6) {
            bottom: 12%;
            left: 30%;
            animation-delay: 1.2s;
        }

        .stars span:nth-child(7) {
            bottom: 18%;
            right: 25%;
            animation-delay: .6s;
        }

        .stars span:nth-child(8) {
            top: 45%;
            left: 22%;
            animation-delay: 1.5s;
        }

        .stars span:nth-child(9) {
            top: 40%;
            right: 18%;
            animation-delay: .4s;
        }


        @keyframes twinkle {

            from {
                opacity: .2;
                transform: scale(.7);
            }

            to {
                opacity: 1;
                transform: scale(1.5);
            }
        }


        /* =========================
           LIGHT CURVES
        ========================= */

        .curve {
            position: absolute;

            width: 120%;
            height: 180px;

            border-top: 3px solid rgba(255, 50, 220, .55);

            border-radius: 50%;

            transform: rotate(-12deg);

            left: -10%;
        }


        .curve1 {
            top: 35%;
            box-shadow:
                0 -10px 20px rgba(255, 30, 220, .3);
        }


        .curve2 {
            bottom: 12%;
            transform: rotate(-15deg);

            border-top-color: rgba(0, 180, 255, .55);

            box-shadow:
                0 -10px 20px rgba(0, 180, 255, .3);
        }


        /* =========================
           FLOATING BOOKS
        ========================= */

        .floating-book {
            position: absolute;

            font-size: 80px;

            filter:
                drop-shadow(0 10px 20px rgba(0, 0, 0, .5));

            animation: bookFloat 5s ease-in-out infinite;
        }


        .book-left {
            top: 17%;
            left: 9%;

            transform: rotate(-20deg);

            animation-delay: 1s;
        }


        .book-right {
            top: 18%;
            right: 8%;

            transform: rotate(15deg);

            animation-delay: 2s;
        }


        .book-bottom-left {
            bottom: 13%;
            left: 5%;

            animation-delay: .5s;
        }


        .book-bottom-right {
            bottom: 17%;
            right: 7%;

            transform: rotate(18deg);

            animation-delay: 2.5s;
        }


        @keyframes bookFloat {

            0%, 100% {
                margin-top: 0;
            }

            50% {
                margin-top: -25px;
            }
        }


        /* =========================
           CENTER CONTENT
        ========================= */

        .content {

            position: absolute;

            z-index: 5;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 700px;

            text-align: center;

            color: white;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            width: 145px;
            height: 105px;

            margin: 0 auto 20px;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 90px;

            animation: logoFloat 4s ease-in-out infinite;

            filter:
                drop-shadow(0 0 15px rgba(255, 190, 40, .8));
        }


        .logo::after {

            content: "";

            position: absolute;

            width: 180px;
            height: 55px;

            bottom: -5px;

            left: 50%;

            transform: translateX(-50%);

            border-bottom: 8px solid #f6a900;

            border-radius: 50%;
        }


        @keyframes logoFloat {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }


        /* =========================
           BOOKNEST TITLE
        ========================= */

        h1 {

            font-size: 90px;

            line-height: 1;

            font-weight: bold;

            letter-spacing: -3px;

            margin-bottom: 20px;

            text-shadow:
                0 5px 25px rgba(0, 0, 0, .4);

            animation: titleIn 1.5s ease;
        }


        h1 span {

            color: #ffbd22;

            text-shadow:
                0 0 20px rgba(255, 180, 30, .5);
        }


        @keyframes titleIn {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           TAGLINE
        ========================= */

        .tagline {

            font-size: 32px;

            font-style: italic;

            letter-spacing: 1px;

            margin-bottom: 30px;

            animation: fadeIn 2s ease;
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .description {

            font-family: Arial, sans-serif;

            font-size: 19px;

            line-height: 1.7;

            max-width: 600px;

            margin: 0 auto 38px;

            color: rgba(255, 255, 255, .9);

            animation: fadeIn 2.5s ease;
        }


        /* =========================
           EXPLORE BUTTON
        ========================= */

        .explore {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 22px;

            width: 440px;

            height: 88px;

            border-radius: 60px;

            text-decoration: none;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 29px;

            font-weight: bold;

            background:
                linear-gradient(
                    90deg,
                    #b72cff,
                    #ec39c3,
                    #ff7348
                );

            border: 3px solid rgba(255, 255, 255, .8);

            box-shadow:
                0 0 15px #ff58e7,
                0 0 35px #ff2dcc,
                0 0 70px rgba(255, 60, 210, .7);

            animation:
                buttonIn 2.8s ease,
                buttonGlow 2s ease-in-out infinite;

            transition: .3s;
        }


        .explore span {

            font-size: 40px;

            transition: .3s;
        }


        .explore:hover {

            transform: scale(1.07);

            box-shadow:
                0 0 25px white,
                0 0 50px #ff36d4,
                0 0 90px #ff36d4;
        }


        .explore:hover span {

            transform: translateX(10px);
        }


        @keyframes buttonIn {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes buttonGlow {

            0%, 100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.2);
            }
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .content {
                width: 90%;
            }

            h1 {
                font-size: 65px;
            }

            .tagline {
                font-size: 25px;
            }

            .floating-book {
                font-size: 55px;
            }

            .explore {
                width: 360px;
                height: 75px;
                font-size: 24px;
            }
        }


        @media (max-width: 600px) {

            .content {
                width: 94%;
            }

            .logo {
                font-size: 65px;
                height: 80px;
            }

            h1 {
                font-size: 48px;
                letter-spacing: -1px;
            }

            .tagline {
                font-size: 21px;
            }

            .description {
                font-size: 15px;
            }

            .explore {
                width: 280px;
                height: 65px;
                font-size: 19px;
            }

            .explore span {
                font-size: 28px;
            }

            .floating-book {
                font-size: 40px;
            }
        }

    </style>
</head>


<body>

    <div class="page">

        <!-- Colorful glowing background -->
        <div class="pink-glow"></div>
        <div class="blue-glow"></div>
        <div class="orange-glow"></div>


        <!-- Stars -->
        <div class="stars">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- Light curves -->
        <div class="curve curve1"></div>
        <div class="curve curve2"></div>


        <!-- Floating books -->
        <div class="floating-book book-left">📕</div>

        <div class="floating-book book-right">📖</div>

        <div class="floating-book book-bottom-left">📖</div>

        <div class="floating-book book-bottom-right">📘</div>


        <!-- CENTER -->
        <div class="content">

            <!-- Logo -->
            <div class="logo">
                📖
            </div>


            <!-- Shop Name -->
            <h1>
                Book<span>Nest</span>
            </h1>


            <!-- Tagline -->
            <p class="tagline">
                A Home for Every Story
            </p>


            <!-- Description -->
            <p class="description">
                Discover stories, knowledge and inspiration,
                <br>
                all in one beautiful place.
            </p>


            <!-- Explore -->
            <a href="login.html" class="explore">

                Explore Books

                <span>→</span>

            </a>

        </div>

    </div>

</body>

</html>
