<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BookNest - Wishlist</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    color:white;

    background:
    radial-gradient(circle at 10% 10%,#d34cff,transparent 25%),
    radial-gradient(circle at 90% 20%,#762cff,transparent 25%),
    linear-gradient(135deg,#12001f,#35005c,#18002d);

    background-size:200% 200%;
    animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 5%;
    background:rgba(20,0,40,.95);
    border-bottom:1px solid rgba(255,255,255,.15);
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.logo span{
    color:#ff75d1;
}

nav{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 14px;
    border-radius:22px;
    font-size:14px;
    font-weight:bold;
}

nav a:hover{
    background:rgba(220,70,255,.25);
}

.container{
    width:92%;
    max-width:1200px;
    margin:40px auto;
}

h1{
    text-align:center;
    font-size:38px;
    margin-bottom:35px;
    color:#ff91d6;
}

.bookGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.bookCard{
    display:flex;
    gap:20px;
    padding:18px;
    border-radius:22px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
}

.bookCard img{
    width:150px;
    height:220px;
    object-fit:cover;
    border-radius:12px;
}

.info{
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.info h2{
    margin-bottom:10px;
}

.author{
    color:#d8c2e4;
    margin-bottom:8px;
}

.price{
    color:#ff91d6;
    font-size:22px;
    font-weight:bold;
    margin:12px 0;
}

button{
    border:none;
    padding:10px 15px;
    border-radius:20px;
    color:white;
    cursor:pointer;
    font-weight:bold;
    background:#d4389c;
}

button:hover{
    transform:translateY(-2px);
}

.empty{
    text-align:center;
    padding:60px 20px;
    font-size:20px;
    color:#dbc9e7;
}

.empty a{
    display:inline-block;
    margin-top:20px;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    background:#7431d8;
    border-radius:25px;
}

@media(max-width:850px){
    .bookGrid{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    header{
        flex-direction:column;
        gap:15px;
    }

    .bookCard{
        flex-direction:column;
        align-items:center;
        text-align:center;
    }
}

</style>

</head>

<body>

<header>

    <div class="logo">
        Book<span>Nest</span>
    </div>

    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="books.html">📚 Categories</a>
        <a href="wishlist.html">❤️ Wishlist</a>
        <a href="cart.html">🛒 Cart</a>
        <a href="order.html">📦 Orders</a>
    </nav>

</header>


<div class="container">

    <h1>❤️ My Wishlist</h1>

    <div
        class="bookGrid"
        id="wishlistGrid">
    </div>

</div>


<script>

function loadWishlist(){

    const grid =
    document.getElementById("wishlistGrid");

    let wishlist =
    JSON.parse(
        localStorage.getItem("wishlist")
    ) || [];


    if(wishlist.length === 0){

        grid.innerHTML = `

            <div class="empty">

                ❤️ Your Wishlist is empty.

                <br>

                Add books from the
                Categories page.

                <br>

                <a href="books.html">
                    Browse Books
                </a>

            </div>

        `;

        return;
    }


    grid.innerHTML = "";


    wishlist.forEach(function(book){

        const card =
        document.createElement("div");

        card.className = "bookCard";


        card.innerHTML = `

            <img
                src="${book.image}"
                alt="${escapeHTML(book.title)}"
                onerror="
                    this.src=
                    'https://via.placeholder.com/300x450/4b126b/ffffff?text=Book';
                "
            >

            <div class="info">

                <h2>
                    ${escapeHTML(book.title)}
                </h2>

                <p class="author">
                    ✍️ ${escapeHTML(book.author)}
                </p>

                <p>
                    🏢 ${escapeHTML(book.publisher || "Unknown")}
                </p>

                <p class="price">
                    ₹${book.price}
                </p>

                <button
                    onclick="removeWishlist('${book.id}')"
                >
                    ❌ Remove
                </button>

            </div>
        `;

        grid.appendChild(card);

    });

}


function removeWishlist(id){

    let wishlist =
    JSON.parse(
        localStorage.getItem("wishlist")
    ) || [];


    wishlist =
    wishlist.filter(
        book => book.id !== id
    );


    localStorage.setItem(
        "wishlist",
        JSON.stringify(wishlist)
    );


    loadWishlist();

}


function escapeHTML(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


loadWishlist();

</script>

</body>
</html>
